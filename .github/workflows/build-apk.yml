name: Android CI/CD Build APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Repoyu Kopyala (Checkout)
      uses: actions/checkout@v4

    - name: JDK 17 Kurulumu
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Gradle Kurulumu
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: 8.4

    - name: HTML dosyasını assets içine kopyala
      run: |
        mkdir -p app/src/main/assets
        SRC=$(find . -name index.html -not -path "./app/*" -not -path "*/node_modules/*" -not -path "./.git/*" | head -n 1)
        if [ -z "$SRC" ]; then
          echo "HATA: index.html reponun hiçbir yerinde yok. Repo içeriği:"
          find . -maxdepth 3 -not -path "./.git/*"
          exit 1
        fi
        echo "Bulunan index.html: $SRC"
        DIR=$(dirname "$SRC")
        if [ "$DIR" = "." ]; then
          cp index.html app/src/main/assets/
          cp *.css *.js app/src/main/assets/ 2>/dev/null || true
          for d in css js img images fonts data; do
            [ -d "$d" ] && cp -r "$d" app/src/main/assets/
          done
        else
          cp -r "$DIR"/. app/src/main/assets/
        fi
        echo "assets içeriği:"
        ls -R app/src/main/assets

    - name: APK Derle (Debug)
      run: gradle assembleDebug

    - name: Derlenen APK Dosyasını Kaydet (Artifact)
      uses: actions/upload-artifact@v4
      with:
        name: wot-xray-trainer-apk
        path: app/build/outputs/apk/debug/app-debug.apk
